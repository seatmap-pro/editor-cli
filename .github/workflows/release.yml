name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Check the npm client can use trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node --version

      - name: Install
        run: yarn install --immutable

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME carries version $tag but package.json says $pkg" >&2
            exit 1
          fi

      - name: Type check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Format
        run: yarn format:check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Smoke the built binary
        run: node bin/seatmap.mjs --version

      - name: Publish to npm
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac
